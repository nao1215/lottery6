       "text": "既読をつけた自分を呪っています。写真を開いた指も呪っています。{grouped(var.lend)}円",
       "when": "var.bv == 12"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "「おやすみ」と「お金」を並べないでください。眠れなくなります。送りました",
       "when": "var.bv == 13"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "写真では答えません。送金で答えます。悔しいですが。{grouped(var.lend)}円",
       "when": "var.bv == 14"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "かわいく生きることに、私の給料が必要な理由を論文にまとめてください。{grouped(var.lend)}円",
       "when": "var.bv == 15"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "笑顔の値段を知ってしまいました。思ったより高いですね。{grouped(var.lend)}円",
       "when": "var.bv == 16"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "待ち受けにしたら、毎朝自分の弱さと向き合うことになります。送りました",
       "when": "var.bv == 17"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "まじめな話に、なぜ自撮りが添付されているのですか。効果は抜群ですが。{grouped(var.lend)}円",
       "when": "var.bv == 18"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "一億当たる前に、私の財布の写真を撮ってください。空っぽです。{grouped(var.lend)}円",
       "when": "var.bv == 19"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "その角度で、私の判断力も斜めになりました。{grouped(var.lend)}円",
       "when": "var.bv == 20"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "見ました。見た以上、払うしかない仕組みにいつの間にかなっています。送りました",
       "when": "var.bv == 21"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "私の部屋で撮った写真で、私からお金を取る。よくできた循環ですね。{grouped(var.lend)}円",
       "when": "var.bv == 22"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "がんばっている私から、がんばっていないあなたへ。{grouped(var.lend)}円",
       "when": "var.bv == 23"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "写真代にしては高すぎますし、写真にしては可愛すぎます。腹が立ちますね。{grouped(var.lend)}円",
       "when": "var.bv == 24"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "何を許すのかは聞きません。聞いたら払えなくなりそうなので。送りました",
       "when": "var.bv == 25"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "括弧書きで補足されても困ります。写真の方で十分伝わっていました。{grouped(var.lend)}円",
       "when": "var.bv == 26"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "ダメではないのが問題なんです。{grouped(var.lend)}円",
       "when": "var.bv == 27"
      },
      {
       "from": "早瀬 葵",
       "icon": "icons/hayase.png",
       "text": "［送金 {grouped(var.lend)}円］"
      }
     ]
    }
